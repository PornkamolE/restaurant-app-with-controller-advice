<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Manager Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <h2 class="mb-4 text-center">📊 Manager Dashboard</h2>

  <!-- ปุ่ม Export -->
  <div class="d-flex justify-content-center mb-4 gap-3">
    <a href="/manager/export/csv" class="btn btn-outline-primary">📄 Export CSV</a>
    <a href="/manager/export/excel" class="btn btn-outline-success">📊 Export Excel</a>
    <a href="/manager/export/pdf" class="btn btn-outline-danger">🧾 Export PDF</a>
  </div>

  <form method="get" action="/manager/dashboard" class="mb-4">
    <div class="row g-2 align-items-end">
      <!-- View Type -->
      <div class="col-md-3">
        <label for="viewType" class="form-label">📅 View Type:</label>
        <select name="viewType" id="viewType" class="form-select" onchange="this.form.submit()">
          <option value="ALL" th:selected="${viewType == 'ALL'}">ทั้งหมด</option>
          <option value="DAILY" th:selected="${viewType == 'DAILY'}">รายวัน</option>
          <option value="MONTHLY" th:selected="${viewType == 'MONTHLY'}">รายเดือน</option>
        </select>
      </div>

      <!-- Daily Date Picker -->
      <div class="col-md-3" th:if="${viewType == 'DAILY'}">
        <label for="date" class="form-label">เลือกวันที่:</label>
        <input type="date" id="date" name="date" class="form-control" th:value="${date}" onchange="this.form.submit()" />
      </div>

      <!-- Monthly Picker -->
      <div class="col-md-3" th:if="${viewType == 'MONTHLY'}">
        <label for="year" class="form-label">ปี (เช่น 2025):</label>
        <input type="number" id="year" name="year" class="form-control" th:value="${year}" placeholder="เช่น 2025" onchange="this.form.submit()" />
      </div>

      <div class="col-md-3" th:if="${viewType == 'MONTHLY'}">
        <label for="month" class="form-label">เดือน (1-12):</label>
        <input type="number" id="month" name="month" class="form-control" th:value="${month}" min="1" max="12" placeholder="เช่น 5" onchange="this.form.submit()" />
      </div>
    </div>
  </form>


  <!-- ตารางแต่ละโต๊ะ -->
  <div th:each="tableInfo : ${tableSummaries}"
       th:class="'card mb-4 shadow-sm ' + (${tableInfo.status} == 'DONE' ? 'border-secondary bg-light' : '')">

    <!-- หัวการ์ด -->
    <div th:class="'card-header d-flex justify-content-between align-items-center ' +
                    (${tableInfo.status} == 'DONE' ? 'bg-light text-dark' : 'bg-info text-dark')">
      <div>โต๊ะ <span th:text="${tableInfo.tableNumber}"></span></div>
      <div class="badge bg-secondary" th:text="${tableInfo.status}">สถานะ</div>
    </div>

    <!-- เนื้อหาภายใน -->
    <div class="card-body">
      <table class="table table-striped table-sm">
        <thead>
        <tr>
          <th>ชื่อเมนู</th>
          <th>หมวดหมู่</th>
          <th>ราคา (บาท)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${tableInfo.items}">
          <td th:text="${item.menuName}">เมนู</td>
          <td th:text="${item.category}">หมวด</td>
          <td th:text="${item.price}">ราคา</td>
        </tr>
        </tbody>
      </table>
      <h5 class="text-end">รวม: <span th:text="${tableInfo.totalPrice}"></span> บาท</h5>
    </div>
  </div>

  <!-- สรุปยอดรวมทั้งหมด -->
  <div class="alert alert-success text-end">
    <strong>ยอดรวมทั้งหมด: <span th:text="${grandTotal}"></span> บาท</strong>
  </div>
</div>

</body>
</html>
